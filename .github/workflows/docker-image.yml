name: Docker Image CI

env:
  PLATFORMS: linux/amd64,linux/arm64

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/ARCA-fe/yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        working-directory: frontend/ARCA-fe
        run: yarn install --frozen-lockfile
      - name: Build frontend
        working-directory: frontend/ARCA-fe
        run: yarn build
      - name: Test frontend
        working-directory: frontend/ARCA-fe
        run: yarn test --watch=false

  midtier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Build and test midtier
        working-directory: midtier/ARCA-mt
        run: mvn --batch-mode --no-transfer-progress verify

  docker-frontend:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: arca
      deployment: true
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          file: "./frontend/ARCA-fe/Dockerfile"
          context: "./frontend/ARCA-fe"
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ vars.DOCKERHUB_USERNAME }}/arca-web:latest

  docker-midtier:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: arca
      deployment: true
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push midtier
        uses: docker/build-push-action@v7
        with:
          file: "./midtier/ARCA-mt/Dockerfile"
          context: "./midtier/ARCA-mt"
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ vars.DOCKERHUB_USERNAME }}/arca-midtier:latest