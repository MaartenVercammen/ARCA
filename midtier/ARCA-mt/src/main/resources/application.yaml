spring:
  application:
    name: ARCA-mt

  datasource:
    url: jdbc:h2:file:./db
    driverClassName: org.h2.Driver
    username: sa
    password: password
    database-platform: org.hibernate.dialect.H2Dialect
    h2:
      console:
        enabled: true
  # Hibernate Configuration
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

jwt:
  secret: 
  expiration: 3600000
  refreshExpiration: 86400000