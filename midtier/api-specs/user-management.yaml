openapi: 3.1.0
info:
  title: ARCA User Management API
  description: Contract-first specification for the User Management domain.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development

security:
  - BearerAuth: [ ]

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Address:
      type: object
      properties:
        street:
          type: string
        houseNumber:
          type: string
        city:
          type: string
        zipCode:
          type: string
        country:
          type: string

    Role:
      type: string
      enum:
        - ROLE_USER
        - ROLE_ADMIN

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          uniqueItems: true

    CreateUserRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          uniqueItems: true

    UpdateUserRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        address:
          $ref: '#/components/schemas/Address'

    UpdateUserRolesRequest:
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          uniqueItems: true

paths:
  /users:
    get:
      summary: List all users
      description: Returns all users. Requires USER role.
      operationId: getUsers
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

    post:
      summary: Create a new user
      description: Creates a new user. Requires ADMIN role.
      operationId: createUser
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid request body
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /users/roles:
    get:
      summary: List available roles
      description: Returns all available roles. Requires ADMIN role.
      operationId: getRoles
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /users/{id}:
    put:
      summary: Update a user
      description: Updates user details. Requires ADMIN role.
      operationId: updateUser
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid request body
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: User not found

  /users/{id}/roles:
    put:
      summary: Update user roles
      description: Updates the roles assigned to a user. Requires authentication.
      operationId: updateUserRoles
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRolesRequest'
      responses:
        '200':
          description: User roles updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid request body
        '401':
          description: Unauthorized
        '404':
          description: User not found
