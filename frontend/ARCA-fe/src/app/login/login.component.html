<div class="login-container">
  <h2>Login</h2>
  <form (submit)="onSubmit($event)">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" [(ngModel)]="username" required placeholder="Username">
      @if (errors.username) {
        <span class="error-message">{{ errors.username }}</span>
      }
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <div class="password-input">
        <input [type]="showPassword ? 'text' : 'password'" id="password" name="password" [(ngModel)]="password" required placeholder="Password">
        <button type="button" (click)="togglePassword()">
          {{ showPassword ? 'Hide' : 'Show' }}
        </button>
      </div>
      @if (errors.password) {
        <span class="error-message">{{ errors.password }}</span>
      }
    </div>
    <button type="submit">Login</button>
  </form>
  @if (generalError) {
    <p class="error-message">{{ generalError }}</p>
  }
  <a routerLink="/register">Register</a>
</div>
