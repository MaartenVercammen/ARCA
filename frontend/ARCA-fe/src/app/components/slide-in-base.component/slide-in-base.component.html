<section class="slide-in-shell">
  <header class="slide-in-header">
    <h2>{{ title() }}</h2>
    <button matIconButton aria-label="Close slide-in" (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <main class="slide-in-body">
    <ng-content></ng-content>
  </main>

  <footer class="slide-in-footer">
    <ng-content select="[slideInFooter]"></ng-content>
  </footer>
</section>
