<div class="container">
  <h2>Users</h2>
  <div>
    <button matButton="filled" (click)="openAddUserSlideIn()">Add user</button>
  </div>
  @if (isLoading()) {
    <p role="status">Loading users...</p>
  } @else if (hasError()) {
    <div role="alert">
      <p>Unable to load users.</p>
      <button matButton type="button" (click)="retryFetch()">Try again</button>
    </div>
  } @else if (users().length === 0) {
    <app-empty-state (retry)="retryFetch()"></app-empty-state>
  } @else {
    <table mat-table [dataSource]="users()" class="mat-shadow-2">
      <ng-container matColumnDef="username">
        <th mat-header-cell *matHeaderCellDef> Username</th>
        <td mat-cell *matCellDef="let element"> {{ element.username }}</td>
      </ng-container>
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef> Email</th>
        <td mat-cell *matCellDef="let element"> {{ element.email }}</td>
      </ng-container>
      <ng-container matColumnDef="phoneNumber">
        <th mat-header-cell *matHeaderCellDef> Phone Number</th>
        <td mat-cell *matCellDef="let element"> {{ element.phoneNumber }}</td>
      </ng-container>
      <ng-container matColumnDef="address">
        <th mat-header-cell *matHeaderCellDef> Address</th>
        <td mat-cell *matCellDef="let element"> {{ element.address | address }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions</th>
        <td mat-cell *matCellDef="let element">
          <button matButton type="button" (click)="openEditUserSlideIn(element)">Edit</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  }
</div>
